[CONFIGURATION]
# Copy this file to a private location and pass it with --config.
# Never commit real Telegram credentials or webhook URLs.
api_id =
api_hash =
phone_number =
data_path = ./data
groups_file = ./groups.csv
device_model = Telos-X

[TRANSLATION]
enabled = true
model_path = ./models/nllb-200-distilled-600M-ct2
tokenizer_name = facebook/nllb-200-distilled-600M
device = cpu
compute_type = int8
inter_threads = 1
intra_threads = 0
beam_size = 4
max_decoding_length = 256

[AI]
enabled = true
model_version = lr_bert_v2

[AI_ALERTING]
enabled = false
medium_notifiers =
high_notifiers =
critical_notifiers =

[PROFILING]
enabled = true
profile_all_users = false
target_usernames =
target_first_names =

[FINDER]
enabled = false

# Example rule. Escape percent signs as %% in ConfigParser regular expressions.
#[FINDER.RULE.MessagesWithURL]
#regex = https?://[^\s]+
#notifier = NOTIFIER.DISCORD_STANDARD
#severity_hint = medium

[STATS_NOTIFIER]
enabled = false
hour = 9
minute = 0
notifiers =

#[NOTIFIER.DISCORD_STANDARD]
#webhook =
#only_rule_matches = false
#prevent_duplication_for_minutes = 5

#[NOTIFIER.SLACK_STANDARD]
#webhook =
#only_rule_matches = false
#prevent_duplication_for_minutes = 5
