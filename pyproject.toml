[project]
name = "telos-x"
version = "0.1.0"
description = "Telegram-based Cyber Threat Intelligence analysis pipeline"
authors = [{ name = "Ed3f" }]
maintainers = [{ name = "Ed3f" }]

license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<3.13"

keywords = [
    "CyberSecurity",
    "CyberThreatIntelligence",
    "CTI",
    "Telegram",
    "OSINT",
    "OpenSourceIntelligence",
    "ThreatIntelligence",
]

classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "Telethon==1.29.2",
    "cryptg>=0.2.post4",
    "SQLAlchemy>=2.0.19,<2.1",
    "alembic>=1.12.1",
    "requests>=2.31.0,<3",
    "cachetools>=5.3.1,<6",
    "Jinja2>=3.0.3",
    "pytz>=2023.3",
    "psutil>=5.9",
    "discord-webhook>=1.3.0,<2",
    "pandas>=2.1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "openpyxl>=3.1",
    "scikit-learn>=1.7,<1.8; python_version < '3.11'",
    "scikit-learn>=1.8,<1.9; python_version >= '3.11'",
    "joblib>=1.3",
    "langdetect>=1.0.9",
    "networkx>=3.1",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/Ed3f/Telos-X"
Repository = "https://github.com/Ed3f/Telos-X"

[project.optional-dependencies]
bert = [
    "torch>=2.1",
    "transformers>=4.48,<5",
    "accelerate>=0.26",
]
local-translation = [
    "ctranslate2>=4.0",
    "transformers>=4.48,<5",
    "sentencepiece>=0.2",
]

[project.scripts]
telos-x = "telos_x.__main__:main"

[tool.poetry]

packages = [
    { include = "telos_x" }
]

include = [
    "README.md",
    "LICENSE",
    "config.example.ini",
    "groups.csv",
    "telos_x/config.ini",
    "telos_x/logging.conf",
    "telos_x/report_templates/*.html",
    "telos_x/ai/*/models/*",
    "telos_x/dataset/*.xlsx",
]

exclude = [
    ".tox",
    ".venv",
    "venv",
    "dist",
    "__pycache__",
]


# ============================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================

[tool.poetry.group.dev.dependencies]

pytest = ">=7.4.0"
pytest-asyncio = ">=0.23"
tox = ">=4.7.0"
coverage = ">=7.3.0"

mypy = ">=1.4.1"
pydocstyle = ">=6.3.0"

bandit = ">=1.7.5"

pylint = ">=2.17.5"
pylint-pytest = ">=1.1.2"
astroid = ">=2.15.6"

pycodestyle = ">=2.11.0"
pep8-naming = ">=0.13.3"

flake8 = ">=6.1.0"
flake8-assertive = ">=2.1.0"
flake8-alfred = ">=1.1.1"
flake8-bugbear = ">=23.7.10"
flake8-builtins = ">=2.1.0"
flake8-blind-except = ">=0.2.1"
flake8-comprehensions = ">=3.14.0"
flake8-docstrings = ">=1.7.0"
flake8-import-order = ">=0.18.2"
flake8-rst-docstrings = ">=0.3.0"

types-pytz = ">=2023.3.0.0"
types-requests = ">=2.31.0.2"
types-cachetools = ">=5.3.0.6"
types-toml = ">=0.10.8.7"

mkdocs = ">=1.5.3,<2"
mkdocs-material = ">=9.4.2,<10"


# ============================================================
# BUILD SYSTEM
# ============================================================

[build-system]

requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"
