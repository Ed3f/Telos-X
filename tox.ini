[tox]
requires =
    tox>=4.20

envlist =
    py310
    py311
    py312

skip_missing_interpreters = true


# ============================================================
# TEST
# ============================================================

[testenv]
description = Run Telos-X tests with {basepython}

package = wheel

setenv =
    PYTHONDONTWRITEBYTECODE = 1

deps =
    pytest>=7.4
    pytest-asyncio>=0.23

commands_pre =
    python -c "from pathlib import Path; Path('.test-tmp').mkdir(exist_ok=True)"

commands =
    pytest {posargs:tests} --basetemp=.test-tmp/{envname} -p no:cacheprovider


# ============================================================
# QUALITY / STATIC ANALYSIS
# ============================================================

[testenv:quality]
description = Run static analysis and security checks

package = wheel

deps =
    mypy>=1.4.1
    pydocstyle>=6.3.0

    pylint>=2.17.5
    pylint-pytest>=1.1.2

    flake8>=6.1.0
    flake8-assertive>=2.1.0
    flake8-alfred>=1.1.1
    flake8-bugbear>=23.7.10
    flake8-builtins>=2.1.0
    flake8-blind-except>=0.2.1
    flake8-comprehensions>=3.14.0
    flake8-docstrings>=1.7.0
    flake8-import-order>=0.18.2
    flake8-rst-docstrings>=0.3.0

    bandit>=1.7.5

    types-pytz>=2023.3.0.0
    types-requests>=2.31.0.2
    types-cachetools>=5.3.0.6
    types-toml>=0.10.8.7

commands =
    mypy --config-file=mypy.ini telos_x

    pydocstyle telos_x --convention=pep257

    pylint telos_x -j 4

    flake8 telos_x

    bandit -r telos_x -x tests


# ============================================================
# COVERAGE
#
# Non è nell'envlist principale.
# Eseguilo manualmente con:
#
# tox -e coverage
# ============================================================

[testenv:coverage]
description = Run tests and generate coverage report

package = wheel

deps =
    pytest>=7.4
    pytest-asyncio>=0.23
    coverage>=7.3

commands =
    coverage erase

    coverage run \
        --source=telos_x \
        -m pytest \
        {posargs:tests} \
        --basetemp=.test-tmp/{envname} \
        -p no:cacheprovider

    coverage report

    coverage html


# ============================================================
# BUILD
# ============================================================

[testenv:build]
description = Build Telos-X wheel and source distribution

skip_install = true

deps =
    build>=1.0

commands =
    python -m build


# ============================================================
# DOCUMENTATION
#
# Non viene eseguita automaticamente con `tox`.
#
# Esegui:
# tox -e docs
# ============================================================

[testenv:docs]
description = Build Telos-X documentation

skip_install = true

deps =
    mkdocs>=1.5.3,<2
    mkdocs-material>=9.4.2,<10

commands =
    mkdocs build \
        --clean \
        --site-dir compiled_docs \
        -v


# ============================================================
# OPTIONAL PYPI DEPLOY
#
# NON presente nell'envlist.
#
# Va usato esplicitamente:
# tox -e deploy
# ============================================================

[testenv:deploy]
description = Publish Telos-X to PyPI

skip_install = true

passenv =
    PYPI_DEPLOY_TOKEN

deps =
    poetry>=2.0

allowlist_externals =
    poetry

commands =
    poetry config pypi-token.pypi {env:PYPI_DEPLOY_TOKEN}
    poetry publish --build


# ============================================================
# FLAKE8
# ============================================================

[flake8]

ignore =
    E501,
    D202,
    D401,
    D902,
    I100,
    I201,
    I202

exclude =
    .git,
    .tox,
    .venv,
    venv,
    __pycache__,
    build,
    dist,
    data,
    assets,
    htmlcov,
    .idea,
    tests

max-complexity = 15

verbose = 2
count = true
show-source = true
statistics = true
jobs = 6
